image: node:22-bookworm

stages:
  - deploy

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    # BrowserRouter needs a fallback when GitLab Pages receives a deep link.
    - cp dist/index.html dist/404.html
    - mv dist public
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
